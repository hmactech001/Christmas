
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>荒木の自己紹介</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: "Yu Gothic", "Meiryo", sans-serif;
            background: #f5f0e8;
            color: #403a35;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 40px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        header {
            text-align: center;
            padding-bottom: 25px;
            border-bottom: 2px solid #e8ded0;
        }

        header h1 {
            font-size: 32px;
            color: #80664f;
            letter-spacing: 4px;
        }

        header p {
            color: #999;
            font-size: 14px;
        }

        section {
            margin-top: 35px;
        }

        section h2 {
            font-size: 20px;
            color: #80664f;
            border-left: 5px solid #c5a98c;
            padding-left: 12px;
        }

        section p, section li {
            font-size: 16px;
            line-height: 2;
        }

        ul {
            padding-left: 25px;
        }

        .memory {
            padding: 20px;
            background: #f8f4ee;
            border-radius: 10px;
        }

        footer {
            margin-top: 40px;
            padding-top: 20px;
            text-align: center;
            border-top: 1px solid #e8ded0;
            color: #80664f;
            font-size: 18px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px 20px;
            }

            header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h1>自己紹介</h1>
            <p>PROFILE PAGE</p>
        </header>

        <section>
            <h2>① 名前</h2>
            <p>荒木です。</p>
        </section>

        <section>
            <h2>② 好きな教科</h2>
            <ul>
                <li>公共</li>
                <li>科学と人間生活</li>
            </ul>
        </section>

        <section>
            <h2>③ ひとまちの思い出</h2>
            <div class="memory">
                <p>
                    少し騒がしいこともありましたが、
                    振り返ってみると、とても楽しく、
                    印象に残る思い出になりました。
                </p>
            </div>
        </section>

        <section>
            <h2>④ 最後に</h2>
            <p>今までありがとうございました。</p>
        </section>

        <footer>
            <p>Thank you for everything.</p>
        </footer>

    </div>

</body>
</html>
